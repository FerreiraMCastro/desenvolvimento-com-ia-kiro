<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Habit Tracker</h1>

    <nav id="tab-bar" aria-label="Visualizações">
      <button id="tab-week" class="tab active" type="button">Semana</button>
      <button id="tab-month" class="tab" type="button">Progresso do mês</button>
    </nav>

    <section id="weekly-view">
      <!-- Stats Panel -->
      <section id="stats" aria-label="Estatísticas">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total de Hábitos</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-today">0</span>
        <span class="stat-label">Marcados Hoje</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-pct-today">0%</span>
        <span class="stat-label">% Hoje</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-pct-week">0%</span>
        <span class="stat-label">% Semana Atual</span>
      </div>
    </section>

    <!-- Week Navigation -->
    <nav id="week-nav" aria-label="Navegação de semana">
      <button id="prev-week" type="button" aria-label="Semana anterior">◀</button>
      <span id="week-range">--/-- - --/--</span>
      <button id="next-week" type="button" aria-label="Próxima semana">▶</button>
      <button id="today-btn" type="button">Hoje</button>
    </nav>

    <!-- Add Habit Form -->
    <form id="add-form" autocomplete="off">
      <input
        type="text"
        id="habit-input"
        placeholder="Nome do hábito"
        aria-label="Nome do hábito"
      />
      <button type="submit" id="add-btn">Adicionar</button>
      <span id="form-error" class="error-msg" role="alert"></span>
    </form>

    <!-- Weekly Table -->
    <table id="weekly-table">
      <thead>
        <tr id="table-header">
          <!-- header cells generated by JS -->
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- habit rows generated by JS -->
      </tbody>
    </table>
    </section>

    <section id="monthly-view" class="hidden">
      <nav id="month-nav" aria-label="Navegação de mês">
        <button id="prev-month" type="button" aria-label="Mês anterior">◀</button>
        <span id="month-label">—</span>
        <button id="next-month" type="button" aria-label="Próximo mês">▶</button>
      </nav>
      <div class="monthly-scroll">
        <table id="monthly-table">
          <thead>
            <tr id="monthly-header">
            </tr>
          </thead>
          <tbody id="monthly-body">
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
